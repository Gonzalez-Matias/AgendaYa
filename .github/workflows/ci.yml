name: CI

# Se ejecuta ante Pull Requests hacia develop y main (las ramas hotfix/** pasan por PR
# hacia main y luego hacia develop, por lo que quedan cubiertas) y tras cada merge.
# Si el plan agrega otra rama de paso (por ejemplo release/**), sumarla a ambas listas.
# Los tests E2E (Cypress) viven en un workflow aparte de ejecución manual (e2e.yml).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Zona horaria fija: el código depende de la hora local del servidor,
  # así los resultados no cambian entre notebooks y runners.
  TZ: America/Argentina/Mendoza

jobs:
  # ---------------------------------------------------------------------------
  # Calidad estática: formato, linter y build (no necesita base de datos)
  # ---------------------------------------------------------------------------
  quality:
    name: quality
    runs-on: ubuntu-latest

    env:
      # db.ts lanza error al importarse si DATABASE_URL no existe; el build solo la necesita definida.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agendaya?schema=public
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Linter (ESLint)
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Tests unitarios (Jest) contra PostgreSQL
  # ---------------------------------------------------------------------------
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agendaya
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agendaya?schema=public
      CYPRESS_INSTALL_BINARY: 0

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Correr migraciones
        run: npx prisma migrate deploy

      - name: Crear base de datos de test
        run: |
          node -e "const { Client } = require('pg'); const c = new Client({ connectionString: 'postgresql://postgres:postgres@localhost:5432/postgres' }); (async () => { await c.connect(); try { await c.query('CREATE DATABASE agendaya_test'); console.log('DB agendaya_test creada'); } catch (e) { if (!/already exists/i.test(e.message)) throw e; console.log('DB agendaya_test ya existía'); } finally { await c.end(); } })()"

      - name: Correr migraciones en la base de test
        run: DATABASE_URL="postgresql://postgres:postgres@localhost:5432/agendaya_test?schema=public" npx prisma migrate deploy

      - name: Tests unitarios (Jest)
        id: tests
        run: npm test
        continue-on-error: true

      - name: Subir reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-report.html
          if-no-files-found: ignore

      - name: Fallar el job si los tests fallaron
        if: steps.tests.outcome != 'success'
        run: exit 1

  # ---------------------------------------------------------------------------
  # Publicación de reportes (solo tras merge a develop/main; no es check requerido)
  # ---------------------------------------------------------------------------
  publish:
    name: publish-reports
    needs: [unit-tests]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Download unit test report
        uses: actions/download-artifact@v4
        with:
          name: unit-test-report
          path: reports
        continue-on-error: true

      - name: Preparar carpeta para publicar
        run: |
          mkdir -p pages-deploy
          if [ -f reports/test-report.html ]; then
            cp reports/test-report.html pages-deploy/
          fi

      - name: Publicar reporte en GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-deploy
          destination_dir: test-reports
          keep_files: true
          publish_branch: gh-pages
        continue-on-error: true

      - name: Agregar resumen al workflow
        if: always()
        run: |
          echo "## 📊 Resultados de Testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f pages-deploy/test-report.html ]; then
            echo "### ✅ Tests Unitarios" >> $GITHUB_STEP_SUMMARY
            echo "- 📈 [Ver reporte en línea](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test-reports/test-report.html)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Tests Unitarios" >> $GITHUB_STEP_SUMMARY
            echo "- No se generó el reporte" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Enlaces útiles" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Ver código](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
