version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agendaya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendaya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agendaya_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./prisma:/app/prisma
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agendaya
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
